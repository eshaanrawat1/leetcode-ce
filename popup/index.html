<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Problem Clipper</title>
    <style>
:root {
  --bg: #17191c;
  --panel: #1e2126;
  --panel-2: #22262c;
  --line: #2f353e;
  --text: #dce1e8;
  --muted: #98a2b3;
  --accent: #7aa2ff;
  --ok: #5dc794;
}

* { box-sizing: border-box; }
html {
  width: 380px;
}
body {
  margin: 0;
  width: 380px;
  min-height: 520px;
  background: linear-gradient(180deg, #15181d 0%, #121418 100%);
  color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app { padding: 12px; }
.header {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(34, 38, 44, 0.82), rgba(25, 28, 33, 0.82));
  border-radius: 10px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.source { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--ok); }
.domain { font-weight: 600; color: var(--text); }
.diag { color: var(--muted); text-transform: lowercase; }
.header-inputs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.tab {
  border-radius: 999px;
  border: 1px solid #313947;
  background: #171b21;
  color: var(--muted);
  padding: 8px 10px;
  cursor: pointer;
  font-weight: 600;
}
.tab.active {
  color: var(--text);
  border-color: #4b79dc;
  background: linear-gradient(180deg, #2c4b87, #24375e);
}

.grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.card {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(34,38,44,.9), rgba(27,30,35,.9));
  border-radius: 10px;
  padding: 10px;
}
.card h2 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .02em;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  border: 1px solid #3a4150;
  background: #232935;
  color: #c8d4f0;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
}
.status { color: var(--muted); font-size: 12px; }

.preview pre {
  margin: 0;
  height: 220px;
  overflow: auto;
  background: #16191f;
  border: 1px solid #2d3340;
  border-radius: 8px;
  padding: 10px;
  white-space: pre-wrap;
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #d6deeb;
}

.footer {
  display: none;
}
.vault-wrap { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.vault-wrap input {
  width: 100%;
  background: #16191f;
  border: 1px solid #313947;
  border-radius: 8px;
  color: var(--text);
  padding: 6px 8px;
}
.actions { display: flex; gap: 8px; }
.header-actions { justify-content: stretch; }
.header-actions .btn { flex: 1; }
.btn {
  border-radius: 8px;
  border: 1px solid #3a4150;
  background: #242a33;
  color: var(--text);
  padding: 8px 12px;
  cursor: pointer;
}
.btn.primary {
  background: #2e4f8f;
  border-color: #4165ab;
}
.btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="header-top">
          <div class="source">
            <span class="dot"></span>
            <span class="domain">leetcode.com</span>
          </div>
          <span id="diag" class="diag">loading</span>
        </div>
        <div class="tabs" role="tablist" aria-label="Problem source">
          <button id="leetcodeTab" class="tab active" type="button" role="tab" aria-selected="true" data-source="leetcode">LeetCode</button>
          <button id="csesTab" class="tab" type="button" role="tab" aria-selected="false" data-source="cses">CSES</button>
        </div>
        <div class="header-inputs">
          <label class="vault-wrap">
            <span>Vault</span>
            <input id="vault" type="text" placeholder="MyVault" />
          </label>
          <label class="vault-wrap">
            <span>Subfolder</span>
            <input id="subfolder" type="text" placeholder="leetcode/problems" />
          </label>
        </div>
        <div class="actions header-actions">
          <button id="copyBtn" class="btn ghost">Copy Markdown</button>
          <button id="sendBtn" class="btn primary" disabled>Send to Obsidian</button>
        </div>
      </header>

      <section class="grid">
        <aside class="card fields">
          <h2>Extracted Fields</h2>
          <div id="chips" class="chips"></div>
          <div id="status" class="status"></div>
        </aside>

        <section class="card preview">
          <h2>Final Note Preview</h2>
          <pre id="preview"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
